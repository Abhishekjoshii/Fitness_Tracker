apiVersion: apps/v1
kind: Deployment

metadata:
  name: fitness-tracker-app
  namespace: fitness

spec:
  replicas: 3

  selector:
    matchLabels:
      app: fitness-tracker-app

  template:
    metadata:
      labels:
        app: fitness-tracker-app

    spec:
      containers:
      - name: fitness-tracker-app

        image: abhishekjoshhi/fitness-tracker:prod

        ports:
        - containerPort: 5000

        envFrom:
        - configMapRef:
            name: fitness-config

        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGODB_URI
---
apiVersion: v1
kind: Service

metadata:
  name: fitness-tracker-service
  namespace: fitness

spec:
  selector:
    app: fitness-tracker-app

  ports:
  - port: 80
    targetPort: 5000

  type: LoadBalancer
